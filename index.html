<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sophia 生日快樂！廣州早茶跳跳</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- 開始畫面 -->
        <div id="start-screen" class="ui-layer">
            <div class="card">
                <h1>🎂 廣州早茶跳跳 🥟</h1>
                <p>點擊螢幕左半邊向左移動，右半邊向右移動。</p>
                <p>收集綠豆湯🍵與蛋糕🎂，躲避气噗噗雲☁️與合約🧾！</p>
                <button id="start-btn">開始遊戲</button>
            </div>
        </div>

        <!-- 遊戲結束/結算畫面 -->
        <div id="game-over-screen" class="ui-layer hidden">
            <div class="card card-birthday">
                <h1 id="score-display">得分: 0</h1>
                <h2>🎉 祝 Sophia (璐洋) 生日快樂！ 🎉</h2>
                <p>再也不當經常被宰之人！<br>每天都不气噗噗！</p>
                <p class="stats">最高分: <span id="high-score">0</span></p>
                <button id="restart-btn">再玩一次</button>
            </div>
        </div>
        
        <!-- 左/右控制區 (視覺輔助/觸控感應) -->
        <div id="touch-left"></div>
        <div id="touch-right"></div>
        
        <!-- 顯示分數 -->
        <div id="hud">得分: <span id="current-score">0</span></div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
